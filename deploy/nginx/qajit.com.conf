# Host nginx vhost for qajit.com on the quizwrap.com server.
# Install: sudo cp deploy/nginx/qajit.com.conf /etc/nginx/sites-available/qajit.com
#          sudo ln -s /etc/nginx/sites-available/qajit.com /etc/nginx/sites-enabled/qajit.com
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (see docs/deploy/qajit-com-runbook.md); it adds the 443 block.
server {
    listen 80;
    listen [::]:80;
    server_name qajit.com www.qajit.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    client_max_body_size 5M;

    location /api/ {
        proxy_pass http://127.0.0.1:8401/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        proxy_pass http://127.0.0.1:8400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
